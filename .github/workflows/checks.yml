name: Sonaweft checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -q
      - run: ruff check --select E9,F63,F7,F82,F401 app.py instascript sonaweft_web scripts tests
      - run: node --check sonaweft_web/static/app.js
      - run: node --check sonaweft_web/static/checkout.js
      - run: git diff --check
