[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "instascript"
version = "0.1.0"
description = "Reel/audio → local AI-verified transcripts. Standalone CLI, optional DeepSeek review, built-in dedup."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "faster-whisper>=1.0",
    "requests>=2.31",
]

[project.scripts]
instascript = "instascript.cli:main"

[tool.setuptools]
packages = ["instascript"]
